<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblab Rezepte ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .text-shadow { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9); }
        .recipe-card { transition: transform 0.3s ease, shadow 0.3s ease; }
        
        /* Animation für das NEU Badge */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .animate-neu { animation: pulse-soft 2s infinite ease-in-out; }
    </style>
</head>

<body class="bg-gray-50 p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8">
            <h1 class="text-4xl font-black text-gray-900 mb-2 italic tracking-tighter">Weblab Rezepte ✨</h1>
            <p class="text-gray-500 font-medium ml-1">Was kochen wir heute Schönes?</p>
        </header>

        <div class="relative mb-6">
            <input type="text" id="search-input" placeholder="Rezepte suchen... (z.B. Pasta, Fisch)"
                class="w-full bg-white border border-gray-200 rounded-2xl py-4 px-6 pl-12 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400 transition-all font-medium">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-xl">🔍</span>
        </div>

        <div class="flex justify-center mb-8">
            <button id="random-btn"
                class="bg-gradient-to-r from-purple-600 to-indigo-700 text-white px-8 py-3 rounded-2xl shadow-lg font-black italic hover:scale-105 transition active:scale-95 flex items-center gap-2">
                🎲 Was soll ich kochen?
            </button>
        </div>

        <div id="category-bar" class="flex overflow-x-auto no-scrollbar gap-3 mb-10 pb-2"></div>

        <div class="flex justify-end px-4 mb-2">
            <div class="text-[9px] font-black uppercase tracking-[0.3em] text-gray-300 italic">
                <span id="current-count">0</span> / <span id="total-count">0</span> Rezepte
            </div>
        </div>

        <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script>
        const recipeGrid = document.getElementById('recipe-grid');
        const categoryBar = document.getElementById('category-bar');
        const searchInput = document.getElementById('search-input');
        let allRecipes = [];

        const emojiMap = {
            'Alle': '🏠', 'Favoriten': '⭐', 'Hähnchen': '🍗', 'Nudeln': '🍝', 
            'Vegetarisch': '🥗', 'Fisch': '🐟', 'Fleisch': '🥩', 'Käse': '🧀', 
            'Suppe': '🥣', 'Frühstück': '🍳', 'Dessert': '🍰', 'Protein': '💪', 
            'Airfryer': '🌬️', 'Gnocchi': '🥔', 'Pasta': '🍝', 'Brot': '🍞'
        };

        async function loadAllRecipes() {
            try {
                const listRes = await fetch('./rezepte.json');
                const recipeFiles = await listRes.json();
                const fetchPromises = recipeFiles.map(file => fetch(`./rezepte/${file}`).then(res => res.json()));
                allRecipes = await Promise.all(fetchPromises);

                renderCategoryButtons();
                displayRecipes(allRecipes);
            } catch (err) {
                console.error("Ladefehler:", err);
            }
        }

        function renderCategoryButtons() {
            const rawCategories = allRecipes.flatMap(r => r.category || []);
            let uniqueCategories = [...new Set(rawCategories)].sort();
            
            // "Alle" nach vorne, "Favoriten" dazu wenn vorhanden
            uniqueCategories = ['Alle', 'Favoriten', ...uniqueCategories];

            categoryBar.innerHTML = uniqueCategories.map(cat => {
                const isActive = cat === 'Alle';
                const emoji = emojiMap[cat] || '🍽️';
                return `
                    <button class="filter-btn shrink-0 ${isActive ? 'bg-orange-500 text-white shadow-md' : 'bg-white text-gray-700'} px-6 py-2 rounded-full shadow-sm border border-gray-200 hover:border-orange-300 transition font-bold active:scale-95 flex items-center gap-2" data-category="${cat}">
                        <span>${emoji}</span> ${cat}
                    </button>
                `;
            }).join('');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const selectedCat = btn.getAttribute('data-category');
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.replace('bg-orange-500', 'bg-white');
                        b.classList.replace('text-white', 'text-gray-700');
                    });
                    btn.classList.replace('bg-white', 'bg-orange-500');
                    btn.classList.replace('text-gray-700', 'text-white');

                    let filtered = allRecipes;
                    if (selectedCat === 'Favoriten') {
                        filtered = allRecipes.filter(r => r.isFavorite);
                    } else if (selectedCat !== 'Alle') {
                        filtered = allRecipes.filter(r => r.category?.includes(selectedCat));
                    }
                    displayRecipes(filtered);
                });
            });
        }

        function displayRecipes(recipes) {
            document.getElementById('current-count').innerText = recipes.length;
            document.getElementById('total-count').innerText = allRecipes.length;

            recipeGrid.innerHTML = recipes.map(recipe => `
                <a href="rezept.html?id=${recipe.id}" class="recipe-card relative block rounded-[2.2rem] shadow-lg overflow-hidden group h-60 bg-gray-200 border border-white">
                    <img src="${recipe.image}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition duration-700">
                    
                    ${recipe.isNew ? `
                        <div class="absolute top-4 right-4 z-20 bg-gradient-to-r from-red-500 to-orange-500 text-white text-[10px] font-black px-3 py-1 rounded-full shadow-xl uppercase tracking-tighter border border-white/20 animate-neu">
                            Neu ✨
                        </div>
                    ` : ''}

                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                    <div class="absolute inset-0 p-5 flex flex-col justify-between text-white">
                        <div class="flex flex-wrap gap-2">
                            ${(recipe.category || []).map(cat => `
                                <span class="bg-white/10 backdrop-blur-md text-[8px] uppercase font-black px-2 py-0.5 rounded-md border border-white/10">${cat}</span>
                            `).join('')}
                        </div>
                        <div>
                            <h2 class="text-xl font-black leading-tight mb-3 text-shadow italic">${recipe.title}</h2>
                            <div class="flex gap-2">
                                <div class="bg-black/40 backdrop-blur-md px-2 py-1 rounded-lg border border-white/10 text-[9px] font-bold flex items-center gap-1.5">
                                    <span>⏱</span> ${recipe.time}
                                </div>
                                <div class="bg-orange-500/50 backdrop-blur-md px-2 py-1 rounded-lg border border-white/20 text-[9px] font-black flex items-center gap-1.5">
                                    <span>🔥</span> ${recipe.calories}
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase();
            const filtered = allRecipes.filter(r => r.title.toLowerCase().includes(query) || r.category?.some(c => c.toLowerCase().includes(query)));
            displayRecipes(filtered);
        });

        document.getElementById('random-btn').addEventListener('click', () => {
            if (allRecipes.length > 0) {
                const randomRecipe = allRecipes[Math.floor(Math.random() * allRecipes.length)];
                window.location.href = `rezept.html?id=${randomRecipe.id}`;
            }
        });

        loadAllRecipes();
    </script>
</body>
</html>
